
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login | MultiVendor</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #24113F, #56358B, #A78BFA);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .login-box {
            background: #F9F6FF;
            width: 100%;
            max-width: 430px;
            padding: 45px 38px;
            border-radius: 25px;
            box-shadow: 0 25px 65px rgba(20, 8, 45, 0.35);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .brand {
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #56358B;
            margin-bottom: 25px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 22px;
            background: #E9DFFF;
            color: #56358B;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h2 {
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 34px;
            font-weight: 700;
            color: #39205F;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #8976A8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 20px;
            color: #56358B;
            font-weight: 600;
            font-size: 14px;
        }

        form input {
            width: 100%;
            padding: 15px;
            margin-top: 9px;
            border: 1px solid #D9CCF5;
            border-radius: 12px;
            background: #FFFFFF;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        form input:focus {
            border-color: #7952B3;
            box-shadow: 0 0 0 4px rgba(121,82,179,0.12);
        }

        .errorlist {
            color: #D12F61;
            font-size: 13px;
            list-style: none;
            margin-top: 6px;
        }

        .helptext {
            display: block;
            color: #8976A8;
            font-size: 12px;
            font-weight: normal;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(100deg, #56358B, #9870E8);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(86,53,139,0.25);
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(86,53,139,0.35);
        }

        .register-link {
            text-align: center;
            margin-top: 27px;
            color: #8976A8;
            font-size: 14px;
        }

        .register-link a {
            color: #56358B;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            color: #9870E8;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #7952B3;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-home:hover {
            color: #39205F;
        }

        @media(max-width: 480px) {
            .login-box {
                padding: 32px 23px;
            }

            h2 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="brand">MultiVendor.</div>

        <div class="icon">♙</div>

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Sign in to discover amazing products.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                LOGIN TO YOUR ACCOUNT
            </button>
        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">Create Account</a>
        </p>

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
